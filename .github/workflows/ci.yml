name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest --cov=skyjam --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t skyjam:ci .
      - name: Smoke test entrypoints
        run: docker run --rm skyjam:ci python -c "import skyjam.features.ingest, skyjam.features.compute; print('ok')"
