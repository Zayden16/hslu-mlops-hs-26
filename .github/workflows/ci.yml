name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The read path is SQL, so CI runs it against a real PostgreSQL rather
    # than mocking it. Mocked SQL would not have caught, for example, a NULL
    # altitude being coerced to zero.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skyjam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/skyjam
        run: uv run pytest --cov=skyjam --cov-report=term-missing

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skyjam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/ingestor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/ingestor/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Includes the grid parity test, which fails if the Go and Python
      # sampling grids drift apart, and the store tests against real SQL.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/skyjam?sslmode=disable
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build python image
        run: docker build -t skyjam:ci .

      - name: Smoke test entrypoints
        run: docker run --rm skyjam:ci python -c "import skyjam.features.compute; print('ok')"

      - name: Build ingestor image
        run: docker build -t skyjam-ingestor:ci services/ingestor

      # The ingestor must fail fast and loudly without a database, rather than
      # starting up and silently collecting nothing.
      - name: Ingestor fails without DATABASE_URL
        run: |
          if docker run --rm skyjam-ingestor:ci; then
            echo "expected a non-zero exit without DATABASE_URL"
            exit 1
          fi
