name: ingest

on:
  schedule:
    # The feature pipeline is the only thing that creates this dataset, so a
    # missed run is permanently lost data.
    #
    # GitHub does not honour a schedule reliably: it drops triggers under load
    # and gives no retry. Measured over the first 11.6 h of running a single
    # hourly cron, only 4 of ~12 expected runs fired (26 % capture, gaps of
    # 3.3-4.9 h). Four staggered crons per hour therefore act as redundancy,
    # not as four times the work: a run takes ~2 min, and build_features()
    # collapses everything landing in the same hourly slot per cell, so extra
    # runs within an hour cost nothing and any one of them saves the slot.
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch:

# Never let two ingest runs write the same slot concurrently.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Poll ADS-B feeds
        env:
          SKYJAM_USER_AGENT: ${{ vars.SKYJAM_USER_AGENT || 'skyjam/0.1 (HSLU MLOps student project)' }}
          SKYJAM_FEATURE_STORE_URI: data/feature_store
          SKYJAM_RAW_STORE_URI: data/raw
        run: uv run skyjam-ingest

      # Data never lives in git. Snapshots are uploaded as artifacts until the
      # GCS bucket is wired up in MS2.
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          # 90 days is the hard cap for public repositories (the API rejects
          # anything higher with 409), and it is NOT enough on its own:
          # ingestion starts at MS1 (17.09.2026) but MS4 is due 10.01.2027,
          # 115 days later, so the earliest ~25 days would expire before the
          # live system is graded. This data cannot be re-fetched, the feed has
          # no history endpoint. Artifacts are therefore only a safety net; the
          # durable store is the GCS bucket wired up in MS2, which must land
          # before 16.12.2026 when the first snapshots start dropping off.
          retention-days: 90
          if-no-files-found: error
