name: ingest (retired)

# The hourly ingest cron has been replaced by the `ingestor` service on
# Railway (services/ingestor), which writes to PostgreSQL.
#
# Why it was retired rather than kept as a backup:
#
# 1. Capture rate. Measured over 74 h, the four staggered crons covered only
#    39 distinct hours (53 %). GitHub drops scheduled triggers under load and
#    offers no retry, and for this dataset a missed hour is unrecoverable
#    because the feed has no history endpoint.
# 2. Durability. Snapshots lived in artifacts capped at 90 days, so the
#    earliest data would have expired on 16.12.2026, before MS4 is graded on
#    10.01.2027.
# 3. Correctness. Running both writers at once would double-poll a
#    rate-limited API, and the measured limit (2-3 requests per burst,
#    recovering after ~15 s) means the two schedules would starve each other.
#
# Kept as a manual-only job so the fallback path stays exercisable and the
# history of this decision is visible in the repo.

on:
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Poll ADS-B feeds
        env:
          SKYJAM_USER_AGENT: ${{ vars.SKYJAM_USER_AGENT || 'skyjam/0.1 (HSLU MLOps student project)' }}
          SKYJAM_FEATURE_STORE_URI: data/feature_store
          SKYJAM_RAW_STORE_URI: data/raw
        run: uv run skyjam-ingest

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          retention-days: 90
          if-no-files-found: error
