[project]
name = "skyjam"
version = "0.1.0"
description = "Forecasting GNSS interference over Europe from live ADS-B navigation-integrity telemetry"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "h3>=4.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
    # The feature store is PostgreSQL on Railway, written by services/ingestor.
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
training = [
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "mlflow>=2.14.0",
]
ui = [
    "streamlit>=1.36.0",
    "pydeck>=0.9.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
skyjam-features = "skyjam.features.compute:main"
skyjam-import-legacy = "skyjam.features.import_legacy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyjam"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
